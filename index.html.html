function countBy(col){
 let m={}; data.forEach(r=>m[r[col]]=(m[r[col]]||0)+1);
 return [Object.keys(m),Object.values(m)];
}

let g=countBy('Gender');
Plotly.newPlot('g1',[{x:g[0],y:g[1],type:'bar'}],{title:'Quantidade por Gênero'});

let age={};
data.forEach(r=>{if(!age[r.Age]) age[r.Age]=[]; age[r.Age].push(r['Quality of Sleep']);});
Plotly.newPlot('g2',[{x:Object.keys(age),y:Object.values(age).map(v=>v.reduce((a,b)=>a+b,0)/v.length),type:'scatter'}],{title:'Qualidade do Sono por Idade'});

let occ={};
data.forEach(r=>{if(!occ[r.Occupation]) occ[r.Occupation]=[]; occ[r.Occupation].push(r['Stress Level']);});
Plotly.newPlot('g3',[{x:Object.keys(occ),y:Object.values(occ).map(v=>v.reduce((a,b)=>a+b,0)/v.length),type:'bar'}],{title:'Estresse por Profissão'});

Plotly.newPlot('g4',[{x:data.map(r=>r['Physical Activity Level']),y:data.map(r=>r['Quality of Sleep']),mode:'markers',type:'scatter'}],{title:'Atividade Física x Qualidade do Sono'});

let sd=countBy('Sleep Disorder');
Plotly.newPlot('g5',[{labels:sd[0],values:sd[1],type:'pie'}],{title:'Distúrbios do Sono'});

let bmiCats=[...new Set(data.map(r=>r['BMI Category']))];
let traces=bmiCats.map(c=>({y:data.filter(r=>r['BMI Category']==c).map(r=>r['Heart Rate']),type:'box',name:c}));
Plotly.newPlot('g6',traces,{title:'Frequência Cardíaca por IMC'});

let gen={};
data.forEach(r=>{if(!gen[r.Gender]) gen[r.Gender]=[]; gen[r.Gender].push(r['Daily Steps']);});
Plotly.newPlot('g7',[{x:Object.keys(gen),y:Object.values(gen).map(v=>v.reduce((a,b)=>a+b,0)/v.length),type:'bar'}],{title:'Passos Diários por Gênero'});

Plotly.newPlot('g8',[{x:data.map(r=>r['Stress Level']),y:data.map(r=>r['Sleep Duration']),mode:'markers',type:'scatter'}],{title:'Estresse x Duração do Sono'});

let bmi={};
data.forEach(r=>{if(!bmi[r['BMI Category']]) bmi[r['BMI Category']]=[]; bmi[r['BMI Category']].push(r['Quality of Sleep']);});
Plotly.newPlot('g9',[{x:Object.keys(bmi),y:Object.values(bmi).map(v=>v.reduce((a,b)=>a+b,0)/v.length),type:'bar'}],{title:'Qualidade do Sono por IMC'});
